<p class="eyebrow">Parte C · Medidas sem biblioteca estatística</p>
<p class="arquivo">analise_distribuicao_normal.py · medidas · aperte → para avançar</p>

<div class="r-stack" style="justify-items:stretch">

<pre style="font-size:30px"><code class="language-python" data-trim data-line-numbers data-ln-start-from="66">
def soma(dados):

    for x in dados:

def media(dados):

</code></pre>
<p class="lead" style="margin-top:8px"><b>Média</b> é a soma feita com um laço dividida pela quantidade.</p>
</div>
<div class="fragment fade-in-then-out" data-fragment-index="0" style="width:100%">
<p class="arquivo">linhas 77 a 83</p>

<pre style="font-size:30px"><code class="language-python" data-trim data-line-numbers data-ln-start-from="77">
def mediana(dados):
    ordenados = ordenar(dados)
    n = len(ordenados)
    meio = n // 2
    if n % 2 == 1:
        return ordenados[meio]
    return (ordenados[meio - 1] + ordenados[meio]) / 2
</code></pre>
<p class="lead" style="margin-top:8px"><b>Mediana</b> ordena a lista. Como 1.000 é par, faz a média dos dois valores do meio.</p>
</div>
<div class="fragment fade-in-then-out" data-fragment-index="1" style="width:100%">
<p class="arquivo">linhas 86 a 93</p>

<pre style="font-size:30px"><code class="language-python" data-trim data-line-numbers data-ln-start-from="86">
def modas(dados):
    frequencias = {}
    for x in dados:
        frequencias[x] = frequencias.get(x, 0) + 1

    maior_freq = max(frequencias.values())
    lista_modas = [valor for valor, freq in frequencias.items() if freq == maior_freq]
    return sorted(lista_modas), maior_freq
</code></pre>
<p class="lead" style="margin-top:8px"><b>Modas</b> contam a frequência de cada nota num dicionário e devolvem todas as que empatam.</p>
</div>
<div class="fragment fade-in-then-out" data-fragment-index="2" style="width:100%">
<p class="arquivo">linhas 96 a 101</p>

<pre style="font-size:30px"><code class="language-python" data-trim data-line-numbers data-ln-start-from="96">
def variancia_amostral(dados, m):
    n = len(dados)
    soma_quadrados = 0
    for x in dados:
        soma_quadrados += (x - m) ** 2
    return soma_quadrados / (n - 1)
</code></pre>
<p class="lead" style="margin-top:8px"><b>Variância amostral</b> divide por n − 1. O desvio-padrão é <code>math.sqrt(var)</code>, na linha 229.</p>
</div>
<div class="fragment" data-fragment-index="3" style="width:100%">
<p class="arquivo">linhas 104 a 110</p>

<pre style="font-size:30px"><code class="language-python" data-trim data-line-numbers data-ln-start-from="104">
def coeficiente_assimetria(dados, m, s):
    # g = n / ((n-1)(n-2)) * soma(((x - média) / s) ** 3)
    n = len(dados)
    soma_cubos = 0
    for x in dados:
        soma_cubos += ((x - m) / s) ** 3
    return (n / ((n - 1) * (n - 2))) * soma_cubos
</code></pre>
<p class="lead" style="margin-top:8px"><b>Assimetria</b> eleva os desvios padronizados ao cubo, o que mostra para que lado a cauda é mais longa.</p>
</div>
</div>

Note:
(50 segundos) Na Parte C cada medida é uma função, e eu vou passando uma por vez. A soma usa um laço e a média divide essa soma pela quantidade. A mediana ordena a lista e, como mil é par, faz a média dos dois valores do meio. A modas conta a frequência de cada nota num dicionário e devolve todas as que empatam na maior frequência. A variância amostral soma os desvios ao quadrado e divide por n menos um, e o desvio-padrão é a raiz dela, com math ponto sqrt. Por último, o coeficiente de assimetria eleva os desvios padronizados ao cubo, o que mostra para que lado a cauda é mais longa. Os resultados foram média sessenta e seis vírgula zero nove, mediana sessenta e seis, moda sessenta e cinco e desvio quinze vírgula dezesseis.

<p class="eyebrow">Partes D e E · Regra 68–95–99,7 e escore z</p>
<p class="arquivo">analise_distribuicao_normal.py · regra_empirica() e escore_z() · aperte → para avançar</p>

<div class="r-stack" style="justify-items:stretch">

<pre style="font-size:24px"><code class="language-python" data-trim data-line-numbers data-ln-start-from="125">
def regra_empirica(dados, m, s):
    resultados = []
    esperados = {1: 68.0, 2: 95.0, 3: 99.7}
    n = len(dados)
    for k in (1, 2, 3):
        limite_inf = m - k * s
        limite_sup = m + k * s
        quantidade = 0
        for x in dados:
            if limite_inf &lt;= x &lt;= limite_sup:
                quantidade += 1
        percentual = quantidade / n * 100
        resultados.append((k, limite_inf, limite_sup, quantidade, percentual, esperados[k]))
    return resultados
</code></pre>
<p class="lead" style="margin-top:8px">Para k = 1, 2 e 3, conta as notas entre <b>média − k·s</b> e <b>média + k·s</b>. Deu 69,6%, 95,4% e 99,6%.</p>
</div>
<div class="fragment fade-in-then-out" data-fragment-index="0" style="width:100%">
<p class="arquivo">linhas 141 a 142</p>

<pre style="font-size:24px"><code class="language-python" data-trim data-line-numbers data-ln-start-from="141">
def escore_z(x, m, s):
    return (x - m) / s
</code></pre>
<p class="lead" style="margin-top:8px">O escore z é <b>(x − média) / s</b>. A nota 0 tem z = −4,36.</p>
</div>
<div class="fragment" data-fragment-index="1" style="width:100%">
<p class="arquivo">linhas 262 a 262</p>

<pre style="font-size:24px"><code class="language-python" data-trim data-line-numbers data-ln-start-from="262">

</code></pre>
<p class="lead" style="margin-top:8px">Na <code>main()</code>, guarda as notas com <b>|z| &gt; 3</b>. Foram 4, as notas 0, 8, 18 e 19.</p>
</div>
</div>

Note:
(45 segundos) A regra empírica calcula, para k igual a um, dois e três, os limites média menos k desvios e média mais k desvios, e um laço conta quantas notas ficam dentro. O percentual é essa contagem dividida por n vezes cem. Deu sessenta e nove vírgula seis, noventa e cinco vírgula quatro e noventa e nove vírgula seis por cento, bem perto de sessenta e oito, noventa e cinco e noventa e nove vírgula sete. A escore z é só x menos a média dividido pelo desvio. Na main, a linha duzentos e sessenta e dois percorre todas as notas e guarda as que têm módulo de z maior que três. Foram quatro, zero, oito, dezoito e dezenove.
